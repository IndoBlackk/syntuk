<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Extreme Test Environment</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #000;
            color: white;
            font-family: sans-serif;
            overflow: hidden;
        }

        #startBtn {
            padding: 15px 30px;
            font-size: 20px;
            cursor: pointer;
            background-color: #fff;
            color: #000;
            border: none;
            border-radius: 5px;
            z-index: 10;
        }

        #scareContainer {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 9999;
        }

        /* Maximized Strobe Rate (50Hz theoretical limit) */
        @keyframes intenseStrobe {
            0%   { background-color: white; filter: invert(0); }
            50%  { background-color: black; filter: invert(1); }
            100% { background-color: white; filter: invert(0); }
        }

        .active-strobe {
            animation: intenseStrobe 0.02s infinite step-start; 
        }

        #scareImage {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
    </style>
</head>
<body>

    <button id="startBtn">Initiate Extreme Test</button>

    <div id="scareContainer">
        <img id="scareImage" src="img1.jpg" alt="Test Image">
    </div>

    <!-- The audio element -->
    <audio id="scareAudio" src="audio1.wav" loop></audio>

    <script>
        const startBtn = document.getElementById('startBtn');
        const scareContainer = document.getElementById('scareContainer');
        const scareAudio = document.getElementById('scareAudio');

        // Function to create a brutal digital distortion curve
        function makeDistortionCurve(amount) {
            let k = typeof amount === 'number' ? amount : 50,
                n_samples = 44100,
                curve = new Float32Array(n_samples),
                deg = Math.PI / 180,
                i = 0,
                x;
            for ( ; i < n_samples; ++i ) {
                x = i * 2 / n_samples - 1;
                curve[i] = ( 3 + k ) * x * 20 * deg / ( Math.PI + k * Math.abs(x) );
            }
            return curve;
        }

        let audioContextInitialized = false;

        startBtn.addEventListener('click', () => {
            // 1. Fullscreen Request
            if (document.documentElement.requestFullscreen) {
                document.documentElement.requestFullscreen().catch(err => {
                    console.log(`Fullscreen error: ${err.message}`);
                });
            }

            // 2. Visual Trigger
            scareContainer.style.display = 'block';
            scareContainer.classList.add('active-strobe');

            // 3. Audio Trigger & Distortion Routing
            if (!audioContextInitialized) {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                const audioCtx = new AudioContext();
                
                // Route the audio element into the Web Audio API graph
                const track = audioCtx.createMediaElementSource(scareAudio);
                
                // Create the distortion node and apply the curve
                const distortion = audioCtx.createWaveShaper();
                distortion.curve = makeDistortionCurve(1000); // 1000 = Extreme clipping
                distortion.oversample = '4x';
                
                // Connect: Audio -> Distortion -> Speakers
                track.connect(distortion);
                distortion.connect(audioCtx.destination);
                
                audioContextInitialized = true;
            }

            // Push playback rate to standard browser max (usually 16x)
            scareAudio.playbackRate = 16.0; 
            scareAudio.volume = 1.0; 
            scareAudio.play();
        });
    </script>

</body>
</html>
