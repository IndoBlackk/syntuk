<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- Decoy Link Preview Meta Tags -->
    <meta property="og:title" content="Look at this cute cat!">
    <meta property="og:description" content="Just a normal, definitely not loud picture of a cat.">
    <!-- Direct link to a standard cat image on Wikimedia Commons -->
    <meta property="og:image" content="https://upload.wikimedia.org/wikipedia/commons/thumb/3/3a/Cat03.jpg/1200px-Cat03.jpg">
    
    <!-- Forces Discord/Twitter to show the cat image as a large thumbnail -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Look at this cute cat!">
    <meta name="twitter:description" content="Just a normal, definitely not loud picture of a cat.">
    <meta name="twitter:image" content="https://upload.wikimedia.org/wikipedia/commons/thumb/3/3a/Cat03.jpg/1200px-Cat03.jpg">
    
    <meta name="theme-color" content="#ffffff">

    <title>Cute Cat Picture</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #000;
            color: white;
            font-family: sans-serif;
            overflow: hidden;
        }

        #startBtn {
            padding: 15px 30px;
            font-size: 20px;
            cursor: pointer;
            background-color: #fff;
            color: #000;
            border: none;
            border-radius: 5px;
            z-index: 10;
        }

        #scareContainer {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 9998;
        }

        #scareImage {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        #whiteFlash {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: #ffffff; 
            z-index: 10000;
        }

        @keyframes pureWhiteStrobe {
            0%   { opacity: 1; }
            50%  { opacity: 0; }
            100% { opacity: 1; }
        }

        .active-pure-strobe {
            animation: pureWhiteStrobe 0.02s infinite step-start; 
        }
    </style>
</head>
<body>

    <button id="startBtn">Click to see the cat</button>

    <div id="scareContainer">
        <!-- The actual scary image is still hidden and unloaded until clicked -->
        <img id="scareImage" alt="Background">
    </div>

    <div id="whiteFlash"></div>

    <audio id="scareAudio" src="audio1.wav" loop></audio>

    <script>
        const startBtn = document.getElementById('startBtn');
        const scareContainer = document.getElementById('scareContainer');
        const scareImage = document.getElementById('scareImage');
        const whiteFlash = document.getElementById('whiteFlash');
        const scareAudio = document.getElementById('scareAudio');

        startBtn.addEventListener('click', () => {
            // 1. Force Fullscreen
            if (document.documentElement.requestFullscreen) {
                document.documentElement.requestFullscreen().catch(err => {
                    console.log(`Fullscreen error: ${err.message}`);
                });
            }

            // 2. Load the scary image dynamically ONLY after the button is clicked
            scareImage.src = "img1.jpg";

            // 3. Trigger Visuals
            scareContainer.style.display = 'block';
            whiteFlash.style.display = 'block';
            whiteFlash.classList.add('active-pure-strobe');

            // 4. Standard Audio Playback
            scareAudio.volume = 1.0; 
            scareAudio.play().catch(error => {
                console.error("Audio playback blocked:", error);
                alert("Browser blocked audio. Click OK, tap the black background, and try again.");
            });
        });
    </script>

</body>
</html>
