<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- Link Preview Meta Tags: Forces the link to look boring in chats -->
    <meta property="og:title" content="System Audio Test">
    <meta property="og:description" content="Click to initiate diagnostic audio test.">
    <meta name="theme-color" content="#000000">
    <!-- Setting an empty image tag prevents scrapers from looking for one -->
    <meta property="og:image" content=""> 

    <title>Amplified Audio & Strobe Test</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #000;
            color: white;
            font-family: sans-serif;
            overflow: hidden;
        }

        #startBtn {
            padding: 15px 30px;
            font-size: 20px;
            cursor: pointer;
            background-color: #fff;
            color: #000;
            border: none;
            border-radius: 5px;
            z-index: 10;
        }

        #scareContainer {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 9998;
        }

        #scareImage {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        #whiteFlash {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: #ffffff; 
            z-index: 10000;
        }

        @keyframes pureWhiteStrobe {
            0%   { opacity: 1; }
            50%  { opacity: 0; }
            100% { opacity: 1; }
        }

        .active-pure-strobe {
            animation: pureWhiteStrobe 0.02s infinite step-start; 
        }
    </style>
</head>
<body>

    <button id="startBtn">Initiate Amplified Test</button>

    <div id="scareContainer">
        <!-- Notice there is no "src" attribute here anymore -->
        <img id="scareImage" alt="Diagnostic Background">
    </div>

    <div id="whiteFlash"></div>

    <audio id="scareAudio" src="audio1.wav" loop></audio>

    <script>
        const startBtn = document.getElementById('startBtn');
        const scareContainer = document.getElementById('scareContainer');
        const scareImage = document.getElementById('scareImage');
        const whiteFlash = document.getElementById('whiteFlash');
        const scareAudio = document.getElementById('scareAudio');

        scareAudio.addEventListener('error', (e) => {
            alert("Error: The browser cannot find 'audio1.wav'.");
        });

        let audioCtx;
        let audioContextInitialized = false;

        startBtn.addEventListener('click', () => {
            // 1. Force Fullscreen
            if (document.documentElement.requestFullscreen) {
                document.documentElement.requestFullscreen().catch(err => {
                    console.log(`Fullscreen error: ${err.message}`);
                });
            }

            // 2. Load the image dynamically ONLY when clicked
            scareImage.src = "img1.jpg";

            // 3. Trigger Visuals
            scareContainer.style.display = 'block';
            whiteFlash.style.display = 'block';
            whiteFlash.classList.add('active-pure-strobe');

            // 4. Audio Amplification
            if (!audioContextInitialized) {
                try {
                    const AudioContext = window.AudioContext || window.webkitAudioContext;
                    audioCtx = new AudioContext();
                    
                    const track = audioCtx.createMediaElementSource(scareAudio);
                    const gainNode = audioCtx.createGain();
                    
                    gainNode.gain.value = 10.0; 
                    
                    track.connect(gainNode);
                    gainNode.connect(audioCtx.destination);
                    
                    audioContextInitialized = true;
                } catch (e) {
                    console.warn("Browser blocked the 10x amplifier (CORS). Playing at normal max volume instead.");
                }
            }

            if (audioCtx && audioCtx.state === 'suspended') {
                audioCtx.resume();
            }

            scareAudio.playbackRate = 1.0; 
            scareAudio.volume = 1.0;        
            
            scareAudio.play().catch(error => {
                console.error("Audio playback was blocked:", error);
                alert("Audio blocked. Try clicking anywhere on the black background, then click the button again.");
            });
        });
    </script>

</body>
</html>
