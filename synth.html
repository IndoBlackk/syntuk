<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Start</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #000;
            color: white;
            font-family: sans-serif;
            overflow: hidden;
        }

        #startBtn {
            padding: 15px 30px;
            font-size: 20px;
            cursor: pointer;
            background-color: #fff;
            color: #000;
            border: none;
            border-radius: 5px;
            z-index: 10;
        }

        #scareContainer {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 9998;
        }

        #scareImage {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* 
           The new pure white overlay. 
           Sits above the image to ensure maximum brightness.
        */
        #whiteFlash {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: #ffffff; /* Maximum screen brightness */
            z-index: 10000;
        }

        /* Violent opacity toggle pushing the hardware limit */
        @keyframes pureWhiteStrobe {
            0%   { opacity: 1; }
            50%  { opacity: 0; }
            100% { opacity: 1; }
        }

        .active-pure-strobe {
            animation: pureWhiteStrobe 0.02s infinite step-start; 
        }
    </style>
</head>
<body>

    <button id="startBtn">Start</button>

    <div id="scareContainer">
        <img id="scareImage" src="img1.jpg" alt="Test Image">
    </div>

    <!-- The pure white flash overlay -->
    <div id="whiteFlash"></div>

    <audio id="scareAudio" src="audio1.wav" loop></audio>

    <script>
        const startBtn = document.getElementById('startBtn');
        const scareContainer = document.getElementById('scareContainer');
        const whiteFlash = document.getElementById('whiteFlash');
        const scareAudio = document.getElementById('scareAudio');

        // Extreme digital distortion curve
        function makeDistortionCurve(amount) {
            let k = typeof amount === 'number' ? amount : 50,
                n_samples = 44100,
                curve = new Float32Array(n_samples),
                deg = Math.PI / 180,
                i = 0,
                x;
            for ( ; i < n_samples; ++i ) {
                x = i * 2 / n_samples - 1;
                curve[i] = ( 3 + k ) * x * 20 * deg / ( Math.PI + k * Math.abs(x) );
            }
            return curve;
        }

        let audioContextInitialized = false;

        startBtn.addEventListener('click', () => {
            // Fullscreen Request
            if (document.documentElement.requestFullscreen) {
                document.documentElement.requestFullscreen().catch(err => {
                    console.log(`Fullscreen error: ${err.message}`);
                });
            }

            // Show base container
            scareContainer.style.display = 'block';

            // Trigger the pure white flash overlay
            whiteFlash.style.display = 'block';
            whiteFlash.classList.add('active-pure-strobe');

            // Audio Distortion & Max Speed
            if (!audioContextInitialized) {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                const audioCtx = new AudioContext();
                
                const track = audioCtx.createMediaElementSource(scareAudio);
                
                const distortion = audioCtx.createWaveShaper();
                distortion.curve = makeDistortionCurve(1000); 
                distortion.oversample = '4x';
                
                track.connect(distortion);
                distortion.connect(audioCtx.destination);
                
                audioContextInitialized = true;
            }

            scareAudio.playbackRate = 16.0; 
            scareAudio.volume = 1.0; 
            scareAudio.play();
        });
    </script>

</body>
</html>
