<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- Link Preview Meta Tags: Protects the surprise in chats -->
    <meta property="og:title" content="Hello">
    <meta property="og:description" content="Click to Enter">
    <meta name="theme-color" content="#000000">
    <meta property="og:image" content=""> 

    <title>Extreme Strobe Test</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #000;
            color: white;
            font-family: sans-serif;
            overflow: hidden;
        }

        #startBtn {
            padding: 15px 30px;
            font-size: 20px;
            cursor: pointer;
            background-color: #fff;
            color: #000;
            border: none;
            border-radius: 5px;
            z-index: 10;
        }

        #scareContainer {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 9998;
        }

        #scareImage {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        #whiteFlash {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: #ffffff; 
            z-index: 10000;
        }

        @keyframes pureWhiteStrobe {
            0%   { opacity: 1; }
            50%  { opacity: 0; }
            100% { opacity: 1; }
        }

        .active-pure-strobe {
            animation: pureWhiteStrobe 0.02s infinite step-start; 
        }
    </style>
</head>
<body>

    <button id="startBtn">Click To Enter</button>

    <div id="scareContainer">
        <img id="scareImage" alt="Diagnostic Background">
    </div>

    <div id="whiteFlash"></div>

    <!-- Standard HTML5 Audio (Bypasses Web Audio API blocks) -->
    <audio id="scareAudio" src="audio1.wav" loop></audio>

    <script>
        const startBtn = document.getElementById('startBtn');
        const scareContainer = document.getElementById('scareContainer');
        const scareImage = document.getElementById('scareImage');
        const whiteFlash = document.getElementById('whiteFlash');
        const scareAudio = document.getElementById('scareAudio');

        // Alert if GitHub cannot find the file
        scareAudio.addEventListener('error', (e) => {
            alert("GitHub Error: Cannot find 'audio1.wav'. Check case-sensitivity (WAV vs wav).");
        });

        startBtn.addEventListener('click', () => {
            // 1. Force Fullscreen
            if (document.documentElement.requestFullscreen) {
                document.documentElement.requestFullscreen().catch(err => {
                    console.log(`Fullscreen error: ${err.message}`);
                });
            }

            // 2. Load the image dynamically (protects link preview)
            scareImage.src = "img1.jpg";

            // 3. Trigger Visuals
            scareContainer.style.display = 'block';
            whiteFlash.style.display = 'block';
            whiteFlash.classList.add('active-pure-strobe');

            // 4. Standard Audio Playback
            scareAudio.volume = 1.0; 
            scareAudio.play().catch(error => {
                console.error("Audio playback blocked:", error);
                alert("Browser blocked audio. Click OK, tap the black background, and try again.");
            });
        });
    </script>

</body>
</html>
