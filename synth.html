<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>hello</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #000;
            color: white;
            font-family: sans-serif;
            overflow: hidden;
        }

        #startBtn {
            padding: 15px 30px;
            font-size: 20px;
            cursor: pointer;
            background-color: #fff;
            color: #000;
            border: none;
            border-radius: 5px;
            z-index: 10;
        }

        #scareContainer {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 9998;
        }

        #scareImage {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* The pure white blinding overlay */
        #whiteFlash {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: #ffffff; 
            z-index: 10000;
        }

        /* Violent opacity toggle pushing the 60Hz hardware limit */
        @keyframes pureWhiteStrobe {
            0%   { opacity: 1; }
            50%  { opacity: 0; }
            100% { opacity: 1; }
        }

        .active-pure-strobe {
            animation: pureWhiteStrobe 0.02s infinite step-start; 
        }
    </style>
</head>
<body>

    <button id="startBtn">Initiate Extreme Test</button>

    <div id="scareContainer">
        <img id="scareImage" src="img1.jpg" alt="Test Image">
    </div>

    <div id="whiteFlash"></div>

    <!-- Ensure your file is correctly named here -->
    <audio id="scareAudio" src="audio1.wav" loop></audio>

    <script>
        const startBtn = document.getElementById('startBtn');
        const scareContainer = document.getElementById('scareContainer');
        const whiteFlash = document.getElementById('whiteFlash');
        const scareAudio = document.getElementById('scareAudio');

        // Error tracking to warn you if the filename is misspelled 
        scareAudio.addEventListener('error', (e) => {
            alert("Error: The browser cannot find 'audio1.wav'. Check the spelling and make sure it is in the exact same folder as this HTML file.");
        });

        startBtn.addEventListener('click', () => {
            // 1. Force Fullscreen
            if (document.documentElement.requestFullscreen) {
                document.documentElement.requestFullscreen().catch(err => {
                    console.log(`Fullscreen error: ${err.message}`);
                });
            }

            // 2. Trigger Visuals
            scareContainer.style.display = 'block';
            whiteFlash.style.display = 'block';
            whiteFlash.classList.add('active-pure-strobe');

            // 3. Direct Audio Playback (Bypasses security blocks)
            scareAudio.playbackRate = 16.0; // Max speed allowed by browsers
            scareAudio.volume = 1.0;        // Max volume
            
            scareAudio.play().catch(error => {
                console.error("Audio playback was blocked:", error);
                alert("Audio blocked. Try clicking anywhere on the black background, then click the button again.");
            });
        });
    </script>

</body>
</html>
